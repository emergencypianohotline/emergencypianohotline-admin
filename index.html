<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Admin Dashboard - Emergency Piano Hotline</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="https://members.emergencypianohotline.com/favicon.ico">

  <!-- Inter font (used by Tabler) -->
  <style>@import url('https://rsms.me/inter/inter.css');</style>

  <!-- Tabler CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/css/tabler.min.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <!-- Overrides -->
  <link rel="stylesheet" href="/assets/css/admin-overrides.css">

  <style>
    .admin-loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--tblr-body-bg, #1a1c2e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .admin-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--tblr-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .admin-loading-text {
      margin-top: 1rem;
      color: var(--tblr-body-color);
      font-size: 0.875rem;
    }

    .admin-login-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--tblr-body-bg, #1a1c2e);
      z-index: 9999;
    }

    .admin-login-screen.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #admin-container {
      display: none;
    }

    #admin-container.ready {
      display: contents;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="admin-loading-screen" id="loading-screen">
    <div class="admin-loading-spinner"></div>
    <div class="admin-loading-text">Loading Admin Dashboard</div>
  </div>

  <!-- Login Screen -->
  <div class="admin-login-screen" id="error-screen">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <h2>Emergency Piano Hotline</h2>
        <p class="text-secondary" id="error-message">Sign in to your admin account</p>
      </div>
      <div class="card card-md">
        <div class="card-body">
          <form id="login-form" autocomplete="off" novalidate>
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" id="login-email" class="form-control" placeholder="admin@example.com" required autocomplete="email">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="login-password" class="form-control" placeholder="Password" required autocomplete="current-password">
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100" id="login-button">Sign in</button>
            </div>
            <div id="login-error" class="text-danger mt-2 small"></div>
            <div id="login-success" class="text-success mt-2 small"></div>
          </form>
        </div>
      </div>
      <div class="text-center text-secondary mt-3">
        <a href="#" class="text-secondary small" id="forgot-password-link">Forgot password?</a>
      </div>
      <div class="text-center mt-3">
        <a href="https://members.emergencypianohotline.com" class="btn btn-ghost-secondary btn-sm">Go to Main Site</a>
      </div>
    </div>
  </div>

  <!-- Admin Container -->
  <div id="admin-container"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Leaflet -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.0/dist/apexcharts.min.js"></script>

  <!-- Tabler JS -->
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.2.0/dist/js/tabler.min.js"></script>

  <!-- Admin Dashboard -->
  <script type="module">
    import { loadAdminDashboard, verifyAdminAccess } from './assets/js/features/admin/index.js';
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './assets/js/config.js';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (!window.HOTLINE) window.HOTLINE = {};
    window.HOTLINE.supabase = supabase;

    // Login form
    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const loginButton = document.getElementById('login-button');
      const loginError = document.getElementById('login-error');
      const loginSuccess = document.getElementById('login-success');

      loginButton.disabled = true;
      loginButton.textContent = 'Signing in...';
      loginError.textContent = '';
      loginSuccess.textContent = '';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.reload();
      } catch (error) {
        loginError.textContent = error.message || 'Login failed.';
        loginButton.disabled = false;
        loginButton.textContent = 'Sign in';
      }
    });

    // Forgot password
    document.getElementById('forgot-password-link')?.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const loginError = document.getElementById('login-error');
      const loginSuccess = document.getElementById('login-success');

      if (!email) { loginError.textContent = 'Enter your email first.'; return; }
      loginError.textContent = '';
      loginSuccess.textContent = '';

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        if (error) throw error;
        loginSuccess.textContent = 'Password reset email sent!';
      } catch (error) {
        loginError.textContent = error.message || 'Failed to send reset email.';
      }
    });

    // Password recovery callback
    async function checkPasswordRecovery() {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      if (hashParams.get('type') !== 'recovery') return false;

      const errorScreen = document.getElementById('error-screen');
      document.getElementById('error-message').textContent = 'Set your new password';
      const loginForm = document.getElementById('login-form');

      loginForm.innerHTML = `
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" id="new-password" class="form-control" placeholder="New password" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Confirm password" required autocomplete="new-password">
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" id="update-password-button">Update Password</button>
        </div>
        <div id="login-error" class="text-danger mt-2 small"></div>
        <div id="login-success" class="text-success mt-2 small"></div>
      `;

      document.getElementById('forgot-password-link').style.display = 'none';

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPw = document.getElementById('new-password').value;
        const confirmPw = document.getElementById('confirm-password').value;
        const btn = document.getElementById('update-password-button');
        const err = document.getElementById('login-error');
        const suc = document.getElementById('login-success');

        if (newPw !== confirmPw) { err.textContent = 'Passwords do not match'; return; }
        if (newPw.length < 6) { err.textContent = 'Password must be at least 6 characters'; return; }

        btn.disabled = true; btn.textContent = 'Updating...'; err.textContent = ''; suc.textContent = '';

        try {
          const { error } = await supabase.auth.updateUser({ password: newPw });
          if (error) throw error;
          suc.textContent = 'Password updated! Redirecting...';
          window.location.hash = '';
          setTimeout(() => window.location.reload(), 1500);
        } catch (error) {
          err.textContent = error.message || 'Failed to update password.';
          btn.disabled = false; btn.textContent = 'Update Password';
        }
      });

      document.getElementById('loading-screen').style.display = 'none';
      errorScreen.classList.add('visible');
      return true;
    }

    // Initialize
    (async () => {
      try {
        if (await checkPasswordRecovery()) return;

        const isAdmin = await verifyAdminAccess();
        if (!isAdmin) {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('error-screen').classList.add('visible');
          return;
        }

        await loadAdminDashboard();
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('admin-container').classList.add('ready');
      } catch (error) {
        console.error('Admin init failed:', error);
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('error-screen').classList.add('visible');
        document.getElementById('error-message').textContent = error.message || 'Failed to load dashboard.';
      }
    })();
  </script>
</body>
</html>
